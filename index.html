<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>めじろダービー馬券アプリ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .fade-in { animation: fadeIn 0.25s ease-in-out forwards; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-emerald-900 text-slate-800 min-h-screen flex flex-col justify-between font-sans antialiased selection:bg-amber-200">

  <!-- ヘッダー：競馬場風看板 -->
  <header class="bg-amber-500 text-slate-900 border-b-4 border-amber-600 shadow-lg py-3 px-4 text-center">
    <div class="max-w-lg mx-auto flex items-center justify-center gap-2">
      <span class="text-2xl">🏇</span>
      <h1 class="text-xl sm:text-2xl font-black tracking-wider">めじろダービー馬券アプリ</h1>
      <span class="text-2xl">🏇</span>
    </div>
  </header>

  <main class="flex-grow flex items-center justify-center p-4">
    <div class="w-full max-w-lg">

      <!-- STEP 1: マークシート（選択画面） -->
      <section id="step-select" class="bg-amber-50 border-4 border-amber-200 rounded-2xl p-5 sm:p-7 shadow-2xl fade-in relative overflow-hidden">
        <div class="absolute top-0 right-0 bg-red-600 text-white text-[10px] font-bold px-3 py-1 rounded-bl-lg tracking-widest uppercase">
          マークカード
        </div>

        <div class="border-b-2 border-dashed border-amber-300 pb-3 mb-5">
          <h2 class="text-lg font-black text-emerald-950 flex items-center gap-2">
            <span class="bg-emerald-800 text-white text-xs px-2 py-0.5 rounded">1着予想</span>
            投票する馬番を選択
          </h2>
          <p class="text-slate-600 text-xs mt-1">1〜7枠の中から本命馬を1頭だけ塗りつぶしてください</p>
        </div>
        
        <div id="options-container" class="grid grid-cols-1 gap-2.5 mb-6">
          <!-- 1〜7の馬番ボタンがJSで生成されます -->
        </div>

        <button id="btn-confirm" disabled class="w-full py-3.5 rounded-xl font-black text-base bg-slate-300 text-slate-500 cursor-not-allowed transition-all duration-150 border-b-4 border-slate-400">
          発券確認画面へ
        </button>
      </section>

      <!-- STEP 2: 確認画面（発券確認） -->
      <section id="step-confirm" class="hidden bg-amber-50 border-4 border-amber-200 rounded-2xl p-5 sm:p-7 shadow-2xl fade-in">
        <div class="text-center mb-4">
          <span class="inline-block bg-amber-200 text-amber-900 text-xs font-bold px-3 py-1 rounded-full mb-1">発券前確認</span>
          <h2 class="text-xl font-black text-slate-900">買い目の確認</h2>
        </div>

        <!-- 擬似馬券カード -->
        <div class="bg-white border-2 border-slate-900 rounded-lg p-5 shadow-inner mb-6 relative">
          <div class="text-[10px] text-slate-400 font-mono flex justify-between border-b pb-1 mb-3">
            <span>MEJIRO DERBY</span>
            <span>単勝馬券</span>
          </div>
          <p class="text-slate-500 text-xs mb-1">選択馬番</p>
          <p id="confirm-target" class="text-4xl font-black text-emerald-700 text-center py-2 border-y-2 border-emerald-800 my-2">
            ◯ 番
          </p>
          <p class="text-center text-xs text-slate-500 font-bold mt-2">この馬券を購入（投票）しますか？</p>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <button id="btn-back" class="w-full py-3 rounded-xl font-bold bg-slate-200 hover:bg-slate-300 text-slate-700 active:scale-95 transition border-b-4 border-slate-300">
            塗りなおす
          </button>
          <button id="btn-submit" class="w-full py-3 rounded-xl font-black bg-emerald-600 hover:bg-emerald-500 active:scale-95 transition text-white border-b-4 border-emerald-800">
            投票確定（購入）
          </button>
        </div>
      </section>

      <!-- STEP 3: 馬券風 投票完了・オッズ（集計）画面 -->
      <section id="step-voted" class="hidden space-y-5 fade-in py-2">
        
        <!-- 発行済み馬券カード -->
        <div class="bg-amber-50 border-4 border-amber-300 rounded-xl p-5 shadow-2xl relative overflow-hidden">
          <div class="absolute -right-6 -top-6 w-20 h-20 bg-emerald-600 rotate-12 flex items-end justify-center pb-2 text-white font-black text-[10px]">
            済
          </div>

          <div class="border-b-2 border-slate-800 pb-2 mb-3 flex justify-between items-baseline">
            <span class="font-black text-lg text-emerald-900">めじろダービー 投票券</span>
            <span class="text-xs font-mono font-bold text-slate-500">投票完了</span>
          </div>

          <!-- 巨大メイン表示 -->
          <div class="bg-white border-2 border-slate-900 rounded-lg p-6 text-center my-3 shadow-inner">
            <p class="text-xs font-bold text-slate-500 mb-1">あなたの本命馬</p>
            <h2 id="voted-result-text" class="text-3xl sm:text-5xl font-black text-emerald-800 leading-tight">
              あなたは◯番に<br class="sm:hidden">投票しました
            </h2>
          </div>

          <div class="text-[10px] text-slate-500 font-mono text-right">
            端末認証ID: LOCAL-DEVICE-VOTED
          </div>
        </div>

        <!-- オッズ・投票分布表 -->
        <div class="bg-emerald-950 border-2 border-emerald-700 rounded-xl p-5 text-white shadow-xl space-y-3">
          <div class="flex items-center justify-between border-b border-emerald-800 pb-2">
            <h3 class="font-black text-amber-400 text-sm flex items-center gap-1">
              <span>📊</span> 全体オッズ（投票分布）
            </h3>
            <span id="total-votes-count" class="text-[11px] bg-emerald-900 border border-emerald-700 text-emerald-200 px-2.5 py-0.5 rounded-full font-mono">
              総投票数: -- 票
            </span>
          </div>

          <div id="results-container" class="space-y-2">
            <p class="text-center text-emerald-400 text-xs py-4">最新オッズを計算中...</p>
          </div>
        </div>
      </section>

    </div>
  </main>

  <!-- フッター -->
  <footer class="p-3 text-center border-t border-emerald-800/80 bg-emerald-950/60">
    <p class="text-[11px] text-emerald-300 font-mono">
      © めじろダービー 投票システム
    </p>
  </footer>

  <script>
    // ★Google Apps ScriptのWebアプリURL（末尾が /exec のもの）を設定してください
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz6YO7yemS2lNx1g2qoJpnIlmRfomcwglFHm6W2m8B38JWhXyJxlE03rPUgpuW11737/exec";

    const TOTAL_OPTIONS = 7;
    const STORAGE_KEY = 'voted_option_id';

    let selectedOption = null;

    const elSelect = document.getElementById('step-select');
    const elConfirm = document.getElementById('step-confirm');
    const elVoted = document.getElementById('step-voted');
    
    const optionsContainer = document.getElementById('options-container');
    const btnConfirm = document.getElementById('btn-confirm');
    const btnBack = document.getElementById('btn-back');
    const btnSubmit = document.getElementById('btn-submit');
    
    const confirmTarget = document.getElementById('confirm-target');
    const votedResultText = document.getElementById('voted-result-text');
    const resultsContainer = document.getElementById('results-container');
    const totalVotesCount = document.getElementById('total-votes-count');

    function init() {
      renderOptions();
      checkVotedStatus();
    }

    function renderOptions() {
      optionsContainer.innerHTML = '';
      for (let i = 1; i <= TOTAL_OPTIONS; i++) {
        const btn = document.createElement('button');
        btn.className = `option-btn w-full p-3 rounded-lg border-2 border-amber-300 bg-white hover:bg-amber-100 text-left font-bold flex items-center justify-between transition-all duration-100 shadow-sm`;
        btn.innerHTML = `
          <div class="flex items-center gap-3">
            <span class="w-7 h-7 rounded-full bg-slate-900 text-white flex items-center justify-center font-black text-sm">${i}</span>
            <span class="text-slate-800 font-bold">${i} 番馬</span>
          </div>
          <div class="w-10 h-6 border-2 border-slate-400 rounded bg-amber-50 flex items-center justify-center mark-box">
            <span class="w-full h-full bg-slate-900 opacity-0 transition-opacity"></span>
          </div>
        `;
        btn.onclick = () => selectOption(i, btn);
        optionsContainer.appendChild(btn);
      }
    }

    function selectOption(id, element) {
      selectedOption = id;
      document.querySelectorAll('.option-btn').forEach(btn => {
        btn.classList.remove('border-emerald-600', 'bg-emerald-50');
        btn.querySelector('.mark-box span').classList.add('opacity-0');
      });
      element.classList.add('border-emerald-600', 'bg-emerald-50');
      element.querySelector('.mark-box span').classList.remove('opacity-0');

      btnConfirm.disabled = false;
      btnConfirm.className = "w-full py-3.5 rounded-xl font-black text-base bg-emerald-600 hover:bg-emerald-500 text-white active:scale-[0.99] transition-all duration-150 cursor-pointer shadow-lg border-b-4 border-emerald-800";
    }

    function checkVotedStatus() {
      const savedVoted = localStorage.getItem(STORAGE_KEY);
      if (savedVoted) {
        showVotedScreen(savedVoted);
        fetchResults();
      } else {
        showStep(elSelect);
      }
    }

    function showStep(target) {
      [elSelect, elConfirm, elVoted].forEach(el => el.classList.add('hidden'));
      target.classList.remove('hidden');
    }

    function showVotedScreen(optionId) {
      votedResultText.innerHTML = `あなたは <span class="text-emerald-700 font-black">${optionId}番</span> に<br class="sm:hidden">投票しました`;
      showStep(elVoted);
    }

    async function fetchResults() {
      if (!GAS_WEB_APP_URL || GAS_WEB_APP_URL.includes("YOUR_GAS_WEB_APP_URL")) {
        resultsContainer.innerHTML = `<p class="text-amber-300 text-xs text-center py-2">GASのURLが未設定です</p>`;
        return;
      }

      try {
        const response = await fetch(GAS_WEB_APP_URL);
        const data = await response.json();
        renderResultsGraph(data);
      } catch (err) {
        console.error(err);
        resultsContainer.innerHTML = `<p class="text-red-300 text-xs text-center py-2">オッズの取得に失敗しました</p>`;
      }
    }

    function renderResultsGraph(data) {
      const total = data.total || 0;
      const counts = data.counts || {};
      const myVoted = localStorage.getItem(STORAGE_KEY);

      totalVotesCount.textContent = `総投票数: ${total} 票`;
      resultsContainer.innerHTML = '';

      for (let i = 1; i <= TOTAL_OPTIONS; i++) {
        const count = counts[i] || 0;
        const percent = total > 0 ? Math.round((count / total) * 100) : 0;
        const isMyChoice = String(i) === String(myVoted);

        const row = document.createElement('div');
        row.className = 'space-y-1';
        row.innerHTML = `
          <div class="flex justify-between text-xs">
            <span class="${isMyChoice ? 'text-amber-300 font-black' : 'text-slate-300'}">
              ${i}番馬 ${isMyChoice ? '★あなたの本命' : ''}
            </span>
            <span class="text-emerald-200 font-mono">${count}票 (${percent}%)</span>
          </div>
          <div class="w-full h-2.5 bg-emerald-900 border border-emerald-800 rounded-full overflow-hidden flex">
            <div class="h-full ${isMyChoice ? 'bg-amber-400' : 'bg-emerald-500'} transition-all duration-500" style="width: ${percent}%"></div>
          </div>
        `;
        resultsContainer.appendChild(row);
      }
    }

    btnConfirm.onclick = () => {
      if (!selectedOption) return;
      confirmTarget.textContent = `${selectedOption} 番`;
      showStep(elConfirm);
    };

    btnBack.onclick = () => {
      showStep(elSelect);
    };

    btnSubmit.onclick = async () => {
      if (!selectedOption) return;

      btnSubmit.disabled = true;
      btnSubmit.textContent = '発券処理中...';

      localStorage.setItem(STORAGE_KEY, selectedOption);
      showVotedScreen(selectedOption);

      if (GAS_WEB_APP_URL && !GAS_WEB_APP_URL.includes("YOUR_GAS_WEB_APP_URL")) {
        try {
          const response = await fetch(GAS_WEB_APP_URL, {
            method: 'POST',
            mode: 'cors',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify({ option: selectedOption })
          });
          const data = await response.json();
          renderResultsGraph(data);
        } catch (err) {
          console.error(err);
          fetchResults();
        }
      }

      btnSubmit.disabled = false;
      btnSubmit.textContent = '投票確定（購入）';
    };

    init();
  </script>
</body>
</html>
