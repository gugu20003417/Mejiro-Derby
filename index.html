<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>めじろダービー馬券アプリ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* 画像の鮮やかな緑色をベースカラー（#00734D）として定義 */
    :root {
      --brand-green: #00734D;
      --brand-green-dark: #004d33;
      --brand-green-light: #009966;
    }
    .bg-brand-green { background-color: var(--brand-green); }
    .bg-brand-dark { background-color: var(--brand-green-dark); }
    .border-brand-green { border-color: var(--brand-green); }
    .text-brand-green { color: var(--brand-green); }

    .fade-in { animation: fadeIn 0.25s ease-in-out forwards; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 白抜き（アウトライン）タイトルスタイル */
    .title-white-outline {
      color: #ffffff;
      text-shadow: 
        -2px -2px 0 var(--brand-green-dark),  
         2px -2px 0 var(--brand-green-dark),
        -2px  2px 0 var(--brand-green-dark),
         2px  2px 0 var(--brand-green-dark),
         0px  3px 6px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body class="bg-brand-green text-slate-800 min-h-screen flex flex-col justify-between font-sans antialiased selection:bg-emerald-200">

  <!-- ヘッダー：画像をベースにした緑背景 ＋ 白抜きタイトル -->
  <header class="bg-brand-dark border-b-4 border-emerald-950 shadow-xl py-4 px-4 text-center">
    <div class="max-w-lg mx-auto flex items-center justify-center gap-2">
      <span class="text-2xl drop-shadow">🏇</span>
      <h1 class="text-2xl sm:text-3xl font-black tracking-wider title-white-outline">
        めじろダービー馬券アプリ
      </h1>
      <span class="text-2xl drop-shadow">🏇</span>
    </div>
  </header>

  <main class="flex-grow flex items-center justify-center p-4">
    <div class="w-full max-w-lg">

      <!-- STEP 1: 推し馬投票 -->
      <section id="step-favorite" class="bg-emerald-50 border-4 border-emerald-200 rounded-2xl p-5 sm:p-7 shadow-2xl fade-in relative overflow-hidden">
        <div class="absolute top-0 right-0 bg-rose-600 text-white text-[10px] font-bold px-3 py-1 rounded-bl-lg tracking-widest uppercase">
          STEP 1 / 2
        </div>

        <div class="border-b-2 border-dashed border-emerald-300 pb-3 mb-5">
          <h2 class="text-lg font-black text-brand-green flex items-center gap-2">
            <span class="bg-rose-600 text-white text-xs px-2 py-0.5 rounded">推し馬</span>
            あなたの「推し馬」を選択
          </h2>
          <p class="text-slate-600 text-xs mt-1">一番応援している大好きな馬を選んでください❤️</p>
        </div>
        
        <div id="fav-options-container" class="grid grid-cols-1 gap-2.5 mb-6"></div>

        <button id="btn-fav-next" disabled class="w-full py-3.5 rounded-xl font-black text-base bg-slate-300 text-slate-500 cursor-not-allowed transition-all duration-150 border-b-4 border-slate-400">
          次へ（馬券購入へ）
        </button>
      </section>

      <!-- STEP 2: 馬券購入（1着予想） -->
      <section id="step-ticket" class="hidden bg-emerald-50 border-4 border-emerald-200 rounded-2xl p-5 sm:p-7 shadow-2xl fade-in relative overflow-hidden">
        <div class="absolute top-0 right-0 bg-brand-green text-white text-[10px] font-bold px-3 py-1 rounded-bl-lg tracking-widest uppercase">
          STEP 2 / 2
        </div>

        <div class="border-b-2 border-dashed border-emerald-300 pb-3 mb-5">
          <h2 class="text-lg font-black text-brand-green flex items-center gap-2">
            <span class="bg-brand-green text-white text-xs px-2 py-0.5 rounded">1着予想</span>
            勝ち馬（馬券）を選択
          </h2>
          <p class="text-slate-600 text-xs mt-1">1着でゴールすると思う勝ち馬を選んでください</p>
        </div>
        
        <div id="ticket-options-container" class="grid grid-cols-1 gap-2.5 mb-6"></div>

        <div class="grid grid-cols-3 gap-2">
          <button id="btn-ticket-back" class="py-3 rounded-xl font-bold bg-slate-200 hover:bg-slate-300 text-slate-700 transition border-b-4 border-slate-300">
            戻る
          </button>
          <button id="btn-ticket-confirm" disabled class="col-span-2 py-3.5 rounded-xl font-black text-base bg-slate-300 text-slate-500 cursor-not-allowed transition-all duration-150 border-b-4 border-slate-400">
            発券確認画面へ
          </button>
        </div>
      </section>

      <!-- STEP 3: 発券前確認 -->
      <section id="step-confirm" class="hidden bg-emerald-50 border-4 border-emerald-200 rounded-2xl p-5 sm:p-7 shadow-2xl fade-in">
        <div class="text-center mb-4">
          <span class="inline-block bg-emerald-200 text-emerald-950 text-xs font-bold px-3 py-1 rounded-full mb-1">発券前最終確認</span>
          <h2 class="text-xl font-black text-slate-900">投票内容の確認</h2>
        </div>

        <div class="bg-white border-2 border-slate-900 rounded-lg p-5 shadow-inner mb-6 space-y-4">
          <div class="border-b pb-3">
            <p class="text-slate-400 text-[11px] font-bold">❤️ 推し馬投票</p>
            <p id="confirm-fav-target" class="text-2xl font-black text-rose-600 mt-1">◯ 番馬</p>
          </div>
          <div>
            <p class="text-slate-400 text-[11px] font-bold">🏇 1着予想馬券</p>
            <p id="confirm-ticket-target" class="text-3xl font-black text-brand-green mt-1">◯ 番馬</p>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <button id="btn-confirm-back" class="w-full py-3 rounded-xl font-bold bg-slate-200 hover:bg-slate-300 text-slate-700 transition border-b-4 border-slate-300">
            やり直す
          </button>
          <button id="btn-submit" class="w-full py-3 rounded-xl font-black bg-brand-green hover:bg-emerald-600 text-white transition border-b-4 border-emerald-900">
            投票確定（購入）
          </button>
        </div>
      </section>

      <!-- STEP 4: 投票完了 ＆ 集計結果画面 -->
      <section id="step-voted" class="hidden space-y-5 fade-in py-2">
        
        <!-- 発行済み馬券カード -->
        <div class="bg-emerald-50 border-4 border-emerald-200 rounded-xl p-5 shadow-2xl relative overflow-hidden">
          <div class="absolute -right-6 -top-6 w-20 h-20 bg-brand-green rotate-12 flex items-end justify-center pb-2 text-white font-black text-[10px]">
            済
          </div>

          <div class="border-b-2 border-slate-800 pb-2 mb-3 flex justify-between items-baseline">
            <span class="font-black text-lg text-brand-green">めじろダービー 投票券</span>
            <span class="text-xs font-mono font-bold text-slate-500">投票完了</span>
          </div>

          <!-- 巨大メイン表示 -->
          <div class="bg-white border-2 border-slate-900 rounded-lg p-6 text-center my-3 shadow-inner space-y-3">
            <div>
              <p class="text-xs font-bold text-slate-400">あなたの推し馬</p>
              <p id="voted-fav-text" class="text-xl sm:text-2xl font-black text-rose-600">◯番馬</p>
            </div>
            <hr class="border-slate-200">
            <div>
              <p class="text-xs font-bold text-slate-400">あなたの本命馬券</p>
              <h2 id="voted-ticket-text" class="text-3xl sm:text-4xl font-black text-brand-green leading-tight">
                あなたは◯番に<br class="sm:hidden">投票しました
              </h2>
            </div>
          </div>
        </div>

        <!-- 集計タブ・結果表示エリア -->
        <div class="bg-brand-dark border-2 border-emerald-700 rounded-xl p-5 text-white shadow-xl space-y-4">
          <div class="flex items-center justify-between border-b border-emerald-800 pb-3">
            <h3 class="font-black text-amber-300 text-sm">📊 全体集計結果</h3>
            <span id="total-votes-count" class="text-[11px] bg-emerald-950 border border-emerald-700 text-emerald-200 px-2.5 py-0.5 rounded-full font-mono">
              総投票数: -- 票
            </span>
          </div>

          <!-- 集計切り替えタブ -->
          <div class="grid grid-cols-2 gap-2 bg-emerald-950/70 p-1 rounded-lg">
            <button id="tab-ticket" class="py-1.5 rounded font-bold text-xs bg-amber-400 text-slate-900 shadow">
              🏇 馬券（1着予想）
            </button>
            <button id="tab-favorite" class="py-1.5 rounded font-bold text-xs text-emerald-300 hover:text-white">
              ❤️ 推し馬ランキング
            </button>
          </div>

          <div id="results-container" class="space-y-2">
            <p class="text-center text-emerald-300 text-xs py-4">最新データを計算中...</p>
          </div>
        </div>
      </section>

    </div>
  </main>

  <footer class="p-3 text-center border-t border-emerald-950 bg-brand-dark">
    <p class="text-[11px] text-emerald-200 font-mono">© めじろダービー 投票システム</p>
  </footer>

  <script>
    // ★Google Apps ScriptのWebアプリURL（末尾が /exec のもの）を設定してください
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw7u0eK6JR3XNcJvFm9pAd7CcqWrgWB56PGTjZie4LK9mKGUC0TDP-gCyq_yk2sp96U/exec";

    const TOTAL_OPTIONS = 7;
    const STORAGE_KEY_FAV = 'voted_fav_id';
    const STORAGE_KEY_TICKET = 'voted_ticket_id';

    let selectedFav = null;
    let selectedTicket = null;
    let currentData = null;
    let activeTab = 'ticket';

    const elFav = document.getElementById('step-favorite');
    const elTicket = document.getElementById('step-ticket');
    const elConfirm = document.getElementById('step-confirm');
    const elVoted = document.getElementById('step-voted');

    const btnFavNext = document.getElementById('btn-fav-next');
    const btnTicketBack = document.getElementById('btn-ticket-back');
    const btnTicketConfirm = document.getElementById('btn-ticket-confirm');
    const btnConfirmBack = document.getElementById('btn-confirm-back');
    const btnSubmit = document.getElementById('btn-submit');

    const tabTicket = document.getElementById('tab-ticket');
    const tabFavorite = document.getElementById('tab-favorite');
    const resultsContainer = document.getElementById('results-container');
    const totalVotesCount = document.getElementById('total-votes-count');

    function init() {
      renderFavOptions();
      renderTicketOptions();
      checkVotedStatus();
    }

    function renderFavOptions() {
      const container = document.getElementById('fav-options-container');
      container.innerHTML = '';
      for (let i = 1; i <= TOTAL_OPTIONS; i++) {
        const btn = document.createElement('button');
        btn.className = `fav-btn w-full p-3 rounded-lg border-2 border-emerald-300 bg-white hover:bg-rose-50 text-left font-bold flex items-center justify-between transition-all duration-100 shadow-sm`;
        btn.innerHTML = `
          <div class="flex items-center gap-3">
            <span class="w-7 h-7 rounded-full bg-rose-600 text-white flex items-center justify-center font-black text-sm">${i}</span>
            <span class="text-slate-800 font-bold">${i} 番馬</span>
          </div>
          <span class="text-xs font-bold text-rose-500 opacity-0 mark-text">❤️ 推し</span>
        `;
        btn.onclick = () => {
          selectedFav = i;
          document.querySelectorAll('.fav-btn').forEach(b => {
            b.classList.remove('border-rose-500', 'bg-rose-50');
            b.querySelector('.mark-text').classList.add('opacity-0');
          });
          btn.classList.add('border-rose-500', 'bg-rose-50');
          btn.querySelector('.mark-text').classList.remove('opacity-0');
          btnFavNext.disabled = false;
          btnFavNext.className = "w-full py-3.5 rounded-xl font-black text-base bg-rose-600 hover:bg-rose-500 text-white transition-all cursor-pointer border-b-4 border-rose-800 shadow-lg";
        };
        container.appendChild(btn);
      }
    }

    function renderTicketOptions() {
      const container = document.getElementById('ticket-options-container');
      container.innerHTML = '';
      for (let i = 1; i <= TOTAL_OPTIONS; i++) {
        const btn = document.createElement('button');
        btn.className = `ticket-btn w-full p-3 rounded-lg border-2 border-emerald-300 bg-white hover:bg-emerald-100 text-left font-bold flex items-center justify-between transition-all duration-100 shadow-sm`;
        btn.innerHTML = `
          <div class="flex items-center gap-3">
            <span class="w-7 h-7 rounded-full bg-slate-900 text-white flex items-center justify-center font-black text-sm">${i}</span>
            <span class="text-slate-800 font-bold">${i} 番馬</span>
          </div>
          <div class="w-10 h-6 border-2 border-slate-400 rounded bg-emerald-50 flex items-center justify-center mark-box">
            <span class="w-full h-full bg-slate-900 opacity-0 transition-opacity"></span>
          </div>
        `;
        btn.onclick = () => {
          selectedTicket = i;
          document.querySelectorAll('.ticket-btn').forEach(b => {
            b.classList.remove('border-brand-green', 'bg-emerald-100');
            b.querySelector('.mark-box span').classList.add('opacity-0');
          });
          btn.classList.add('border-brand-green', 'bg-emerald-100');
          btn.querySelector('.mark-box span').classList.remove('opacity-0');
          btnTicketConfirm.disabled = false;
          btnTicketConfirm.className = "col-span-2 py-3.5 rounded-xl font-black text-base bg-brand-green hover:bg-emerald-600 text-white transition-all cursor-pointer border-b-4 border-emerald-900 shadow-lg";
        };
        container.appendChild(btn);
      }
    }

    function checkVotedStatus() {
      const savedFav = localStorage.getItem(STORAGE_KEY_FAV);
      const savedTicket = localStorage.getItem(STORAGE_KEY_TICKET);

      if (savedFav && savedTicket) {
        showVotedScreen(savedFav, savedTicket);
        fetchResults();
      } else {
        showStep(elFav);
      }
    }

    function showStep(target) {
      [elFav, elTicket, elConfirm, elVoted].forEach(el => el.classList.add('hidden'));
      target.classList.remove('hidden');
    }

    function showVotedScreen(favId, ticketId) {
      document.getElementById('voted-fav-text').textContent = `${favId} 番馬`;
      document.getElementById('voted-ticket-text').innerHTML = `あなたは <span class="text-brand-green font-black">${ticketId}番</span> に<br class="sm:hidden">投票しました`;
      showStep(elVoted);
    }

    async function fetchResults() {
      if (!GAS_WEB_APP_URL || GAS_WEB_APP_URL.includes("YOUR_GAS_WEB_APP_URL")) {
        resultsContainer.innerHTML = `<p class="text-amber-300 text-xs text-center py-2">GASのURLが未設定です</p>`;
        return;
      }

      try {
        const response = await fetch(GAS_WEB_APP_URL);
        currentData = await response.json();
        renderResultsGraph();
      } catch (err) {
        console.error(err);
        resultsContainer.innerHTML = `<p class="text-red-300 text-xs text-center py-2">データの取得に失敗しました</p>`;
      }
    }

    function renderResultsGraph() {
      if (!currentData) return;

      const total = currentData.total || 0;
      const counts = (activeTab === 'ticket') ? (currentData.ticketCounts || {}) : (currentData.favoriteCounts || {});
      const myVoted = (activeTab === 'ticket') ? localStorage.getItem(STORAGE_KEY_TICKET) : localStorage.getItem(STORAGE_KEY_FAV);

      totalVotesCount.textContent = `総投票数: ${total} 票`;
      resultsContainer.innerHTML = '';

      for (let i = 1; i <= TOTAL_OPTIONS; i++) {
        const count = counts[i] || 0;
        const percent = total > 0 ? Math.round((count / total) * 100) : 0;
        const isMyChoice = String(i) === String(myVoted);

        const row = document.createElement('div');
        row.className = 'space-y-1';
        row.innerHTML = `
          <div class="flex justify-between text-xs">
            <span class="${isMyChoice ? (activeTab === 'ticket' ? 'text-amber-300 font-black' : 'text-rose-300 font-black') : 'text-slate-300'}">
              ${i}番馬 ${isMyChoice ? (activeTab === 'ticket' ? '★あなたの本命' : '❤️あなたの推し') : ''}
            </span>
            <span class="text-emerald-200 font-mono">${count}票 (${percent}%)</span>
          </div>
          <div class="w-full h-2.5 bg-emerald-950 border border-emerald-800 rounded-full overflow-hidden flex">
            <div class="h-full ${isMyChoice ? (activeTab === 'ticket' ? 'bg-amber-400' : 'bg-rose-500') : 'bg-emerald-500'} transition-all duration-500" style="width: ${percent}%"></div>
          </div>
        `;
        resultsContainer.appendChild(row);
      }
    }

    btnFavNext.onclick = () => showStep(elTicket);
    btnTicketBack.onclick = () => showStep(elFav);
    
    btnTicketConfirm.onclick = () => {
      document.getElementById('confirm-fav-target').textContent = `${selectedFav} 番馬`;
      document.getElementById('confirm-ticket-target').textContent = `${selectedTicket} 番馬`;
      showStep(elConfirm);
    };

    btnConfirmBack.onclick = () => showStep(elTicket);

    btnSubmit.onclick = async () => {
      if (!selectedFav || !selectedTicket) return;

      btnSubmit.disabled = true;
      btnSubmit.textContent = '送信中...';

      localStorage.setItem(STORAGE_KEY_FAV, selectedFav);
      localStorage.setItem(STORAGE_KEY_TICKET, selectedTicket);
      showVotedScreen(selectedFav, selectedTicket);

      if (GAS_WEB_APP_URL && !GAS_WEB_APP_URL.includes("YOUR_GAS_WEB_APP_URL")) {
        try {
          const response = await fetch(GAS_WEB_APP_URL, {
            method: 'POST',
            mode: 'cors',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify({ favorite: selectedFav, ticket: selectedTicket })
          });
          currentData = await response.json();
          renderResultsGraph();
        } catch (err) {
          console.error(err);
          fetchResults();
        }
      }

      btnSubmit.disabled = false;
      btnSubmit.textContent = '投票確定（購入）';
    };

    tabTicket.onclick = () => {
      activeTab = 'ticket';
      tabTicket.className = "py-1.5 rounded font-bold text-xs bg-amber-400 text-slate-900 shadow";
      tabFavorite.className = "py-1.5 rounded font-bold text-xs text-emerald-300 hover:text-white";
      renderResultsGraph();
    };

    tabFavorite.onclick = () => {
      activeTab = 'favorite';
      tabFavorite.className = "py-1.5 rounded font-bold text-xs bg-rose-600 text-white shadow";
      tabTicket.className = "py-1.5 rounded font-bold text-xs text-emerald-300 hover:text-white";
      renderResultsGraph();
    };

    init();
  </script>
</body>
</html>
